[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="event-driven-ingestion-analytics-engine"
version="0.1.0"
requires-python=">=3.10"
[project.optional-dependencies]
dev=["pytest>=8"]
stream=["pyspark>=3.5","boto3>=1.34","psycopg[binary]>=3.1"]
[tool.setuptools.packages.find]
where=["src"]
